<link rel="import" href="../../assets/libs/polymer/polymer.html">

<dom-module id="widget-poster">

	<template>
		<iron-ajax url="https://vimeo.com/api/v2/4487625/info.json" last-response="{{data}}" auto></iron-ajax>
		<style include='shared-styles'></style>
		<style>
			:host {
				display: flex;
				align-items: center;
				justify-content: space-between;
				box-sizing: border-box;
				padding: 2.4rem 1.2rem 2.4rem 1.2rem;
			}

			/*p {
				color: var(--darker-color);
				font-size: var(--medium-size);
				font-weight: 200;
				padding-right: 2rem;
				margin: 0;
				margin-bottom: 2rem;
			}

			h2 {
				color: var(--darkest-color);
				font-weight: 400;
				text-transform: uppercase;
				font-size: var(--larger-size);
				margin: 0;
				margin-bottom: 2rem;
				padding-right: 2rem;
			}*/

			iron-image {
				width: 100%;
				background-color: black;
			}

			iron-image:before {
				content: "";
				display: block;
				margin-top: 100%;
			}

			h2 {
				font-weight: 300;
				margin: 0;
			}
			.poster-image {
				flex: 1;
			}

			.poster-description {
				flex: 2;
			}
			.awards {
				display: grid;
				grid-template-columns: 1fr 1fr 1fr 1fr;
				column-gap: 30px;
			}

			.press {
				text-align: center;
				margin: 2.4rem auto 0;
				max-width: 320px;
			}

			.press:before {
				content: "";
				display: block;
				width: 40px;
				height: 2px;
				background: var(--accent-color);
				margin: 0 auto 1.6rem;
			}

			.press img {
				display: block;
				margin: 0 auto;
				height: auto;
				/* Logos are black ink on transparent; invert to white for the black page */
				filter: invert(1);
			}

			.press .press-headline {
				width: 68%;
				margin: 0 auto 0.4rem;
			}

			.press .press-source {
				width: 85%;
			}

			/* Mafia: anchor the NYT accolade to the bottom, aligned with the poster's bottom edge */
			:host([title="mafia"]) {
				align-items: stretch;
			}

			:host([title="mafia"]) .poster-description {
				display: flex;
				flex-direction: column;
			}

			:host([title="mafia"]) .press {
				margin-top: auto;
			}

			@media screen and (max-width: 640px) {
				:host {
					display: block;
					-webkit-column-count: 1;
					-moz-column-count: 1;
					column-count: 1;
				}
				:host {
					padding: 1.2rem .6rem 1.2rem .6rem;
				}

				.awards {
					grid-template-columns: 1fr 1fr;
				}

				.press {
					max-width: 100%;
				}
			}
		</style>
		<div class="poster-image"><iron-image sizing="contain" preload fade src="/assets/images/{{title}}.jpg"></iron-image></div>
		<div class="poster-description">
			<p><b>{{getFilmTitle(title)}}</b>{{getFilmBody(title)}}</p>
			<p>{{getFilmDirector(title)}}</p>
			<div class="awards">
				<template is="dom-repeat" items="{{getFilmAwards(title)}}">
					<iron-image sizing="contain" preload fade src="/assets/images/{{item}}">
				</template>
			</div>
			<template is="dom-if" if="{{isMafia(title)}}">
				<div class="press">
					<img class="press-headline" src="/assets/images/nyt-best-tv-2025.png" alt="Best TV Shows of 2025">
					<img class="press-source" src="/assets/images/nyt-masthead.png" alt="The New York Times">
				</div>
			</template>
		</div>
		<hr />
	</template>

	<script>
		Polymer({
			is: 'widget-poster',
			properties: {
				title: {
					type: String
				}
			},
			getFilmTitle: function(title) {
				console.log({title})
				return title === "kasper_sophie" ? 'Kasper and Sophie (2022)' : title === 'mafia' ? 'Mafia (2025)' : 'Want To See Something? (2011)';
			},
			getFilmBody: function(title) {
				return title === "kasper_sophie" ? ' A provocative story of love and betrayal in the midst of adolescent mental illness. This single shot film raises the question of how far one is willing to go for the sake of love culminating in a terrible deed. ' : title === 'mafia' ? ' is a six-episode crime series, drawing inspiration from actual events. It unfolds the transformation of Sweden in the 1990s, evolving from a relatively tranquil nation untouched by organised crime into a land marked by intense gang conflicts and violent shootouts. The series also delves into the life of the notorious gangster Radovan “Jakov” Jakovic, chronicling his journey from poverty to wealth. ' : ' A film based on an original story by the American author Raymond Carver. About a complex conflict between two neighbors that has its bases in a tragic event that ripped up the ties between the old friends.';
			},

			getFilmDirector: function(title) {
				return title === "mafia" ? 'Director ep 4-6: Tomas Jonsgården' : 'Writer & Director: Tomas Jonsgården';
			},

			getFilmAwards: function(title) {
				return []
			},

			isMafia: function(title) {
				return title === 'mafia';
			},

		});
	</script>

</dom-module>
